name: MiniPay Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-and-build:
    name: Lint, Migrate, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minipay
          POSTGRES_PASSWORD: adminminipay123
          POSTGRES_DB: minipay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://minipay:adminminipay123@localhost:5432/minipay_test?schema=public"
      JWT_SECRET: "test_jwt_secret_key_123456789"
      JWT_REFRESH_SECRET: "test_jwt_refresh_secret_key_987654321"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml


      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Database Migrations
        run: pnpm exec prisma migrate deploy


      - name: Run E2E Test Suite (48 Tests)
        run: pnpm run test:e2e

      - name: Verify TypeScript Build
        run: pnpm run build
